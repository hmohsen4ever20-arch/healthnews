name: Build Signed Release APK (Health Plus)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'شماره نسخه (1)'
        required: true
        default: '1'
      version_name:
        description: 'نام نسخه (1.0)'
        required: true
        default: '1.0'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: |
          npm install
          npm run build
          npx cap init "Health Plus" "ir.healthplus.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Generate Health Icon & Configure Android Back
        run: |
          pip install pillow
          python3 - << 'EOF'
          from PIL import Image, ImageDraw
          img = Image.new("RGBA", (512, 512), (6, 17, 14, 255))
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle([20, 20, 492, 492], radius=110, fill=(15, 35, 29, 255), outline=(6, 182, 212, 255), width=14)
          draw.ellipse([80, 80, 432, 432], fill=(9, 29, 24, 255), outline=(16, 185, 129, 255), width=10)
          draw.polygon([(256, 110), (140, 230), (256, 400), (372, 230)], fill=(52, 211, 153, 255))
          img.save("Health-Icon.png")

          import os, shutil
          res = "android/app/src/main/res"
          for fld, px in {"mipmap-mdpi":48, "mipmap-hdpi":72, "mipmap-xhdpi":96, "mipmap-xxhdpi":144, "mipmap-xxxhdpi":192}.items():
              p = os.path.join(res, fld)
              os.makedirs(p, exist_ok=True)
              im = img.resize((px, px), Image.Resampling.LANCZOS)
              im.save(os.path.join(p, "ic_launcher.png"))
              im.save(os.path.join(p, "ic_launcher_round.png"))
              im.save(os.path.join(p, "ic_launcher_foreground.png"))
          if os.path.exists(os.path.join(res, "mipmap-anydpi-v26")):
              shutil.rmtree(os.path.join(res, "mipmap-anydpi-v26"))
          EOF

          cat << 'EOF' > android/app/src/main/java/ir/healthplus/app/MainActivity.java
          package ir.healthplus.app;
          import android.os.Bundle;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (getBridge() != null && getBridge().getWebView() != null) {
                              getBridge().getWebView().evaluateJavascript(
                                  "(function(){ return window.handleAndroidBack ? window.handleAndroidBack() : 'EXIT'; })()",
                                  res -> { if (res != null && res.contains("EXIT")) finish(); }
                              );
                          } else { finish(); }
                      }
                  });
              }
          }
          EOF

      - name: Build & Sign APK
        working-directory: ./android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          VER_CODE="${{ github.event.inputs.version_code }}"
          VER_NAME="${{ github.event.inputs.version_name }}"
          sed -i -E "s/versionCode[[:space:]]*=?[[:space:]]*[0-9]+/versionCode ${VER_CODE:-1}/g" app/build.gradle
          sed -i -E "s/versionName[[:space:]]*=?[[:space:]]*\"[^\"]+\"/versionName \"${VER_NAME:-1.0}\"/g" app/build.gradle

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release-key.jks
          else
            keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
              -alias appkey -storepass 123456 -keypass 123456 \
              -dname "CN=HealthPlus, OU=Mobile, O=HealthApp, L=Mashhad, S=Khorasan, C=IR"
          fi

          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release-key.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=appkey \
            -Pandroid.injected.signing.key.password=123456

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HealthPlus-Release
          path: android/app/build/outputs/apk/release/app-release.apk
